[options]
isa rv32iZmmul_Xdsq

[depth]
insn            20
# tapeout uses the slow (multi-cycle) picorv32_pcpi_mul, so MUL needs a longer window
insn_mul        50
# MULH* run the shift-add loop for 64 steps (mul_counter = 63)
insn_mulh       90
insn_mulhsu     90
insn_mulhu      90
reg       15    25
pc_fwd    10    30
pc_bwd    10    30
# slow MULH* takes ~70 cycles, so the "next instruction retires" window must exceed that
liveness  1  10 100
unique    1  10 30
causal    10    30
cover     1     15

csrw            15
csr_ill         15
csrc_inc   1    15
csrc_upcnt 1    15

[sort]
reg_ch0

[csrs]
mcycle          inc upcnt
minstret        inc upcnt

[illegal_csrs]
c00     u       w
c80     u       w
c02     u       w
c82     u       w

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_UMODE
`define DEBUGNETS
`define DSQ_ENABLE_IRQ 1
`define DSQ_NO_IRQ_INSNS
`define DSQ_EXTRA_RESET_CYCLES 2

[defines liveness]
`define PICORV32_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/@core@.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
